name: Build AI Friday APK

on:
  push:
    branches: [main, claude/intelligent-ritchie-nG840]
    paths:
      - 'ai_friday/**'
      - '.github/workflows/build-ai-friday-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_friday

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Create .env
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'placeholder_replace_with_your_key' }}" > .env

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-friday-apk
          path: ai_friday/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish APK to apk-build branch
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p /tmp/apk-out
          cp ai_friday/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/apk-out/ai-friday-arm64-v8a.apk
          ls -lah /tmp/apk-out/
          cd "$(mktemp -d)"
          git init -q -b apk-build
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          cp /tmp/apk-out/ai-friday-arm64-v8a.apk .
          git add ai-friday-arm64-v8a.apk
          git commit -q -m "APK build ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-build
