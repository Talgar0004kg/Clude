name: Deploy ChatBiz frontend to GitHub Pages

# Деплой фронтенда (ai-chat-platform/frontend) на GitHub Pages.
# Запускается вручную или при изменениях фронтенда в этой ветке.
on:
  workflow_dispatch:
  push:
    branches: [claude/website-visualization-project-ox95zr]
    paths: ['ai-chat-platform/frontend/**', '.github/workflows/deploy-frontend.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-chat-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-chat-platform/frontend/package-lock.json
      # Автоматически включает GitHub Pages (Source = GitHub Actions)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      # Чтобы подключить реальный бэкенд, задайте секрет VITE_API_URL в настройках репозитория.
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ai-chat-platform/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
