name: ai_friday
description: "Пятница (F.R.I.D.A.Y.) — Персональный AI голосовой ассистент"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # AI / Gemini (REST + Google Search grounding)
  http: ^1.2.2

  # Permissions & Device
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2

  # Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4

  # Environment
  flutter_dotenv: ^5.2.1

  # Contacts (discontinued but functional; namespace patched in android/build.gradle.kts)
  contacts_service: ^0.6.3

  # Android Intents
  android_intent_plus: ^5.0.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Voice (speech-to-text + text-to-speech)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
